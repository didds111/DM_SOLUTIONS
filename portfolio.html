<style>
:root{--navy:#0b356d;--deep:#0b1730;--blue:#1b5798;--line:#e6eaf0;--text:#101827;--muted:#687383;--bg:#f7f9fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text);background:#fff}a{color:inherit;text-decoration:none}.container{width:min(1180px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.header-inner{height:82px;display:flex;align-items:center;justify-content:space-between;gap:30px}.logo{width:225px;height:auto;display:block}nav{display:flex;gap:34px;font-size:15px;font-weight:700}nav a:hover{color:var(--navy)}.header-cta{background:var(--navy);color:#fff;padding:15px 24px;border-radius:8px;font-weight:800}
.hero{background:var(--bg);padding:88px 0 52px}.eyebrow,.section-kicker{font-size:13px;letter-spacing:4px;color:var(--blue);font-weight:800;margin-bottom:14px}.hero h1{font-size:clamp(38px,5vw,60px);letter-spacing:-2px;line-height:1.15;margin:0 0 20px}.hero p{font-size:18px;line-height:1.8;color:var(--muted);margin:0}
main{padding:46px 0 100px;background:var(--bg);min-height:380px}.portfolio-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.portfolio-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.portfolio-photo{height:170px;background:linear-gradient(135deg,#e8edf3,#cbd5e1);display:flex;align-items:center;justify-content:center;color:#778292;font-size:14px}.portfolio-photo img{width:100%;height:100%;object-fit:cover;display:block}.portfolio-body{padding:15px}.portfolio-body strong{display:block;font-size:16px;margin-bottom:7px}.portfolio-body p{margin:0;color:var(--muted);font-size:13px;line-height:1.6;white-space:pre-line}.portfolio-date{display:block;color:#8993a1;font-size:12px;margin-top:12px}.portfolio-extra-images{display:none}.portfolio-extra-images img{width:72px;height:60px;object-fit:cover;border-radius:6px;flex:none}.empty{padding:52px 20px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted);line-height:1.8}
footer{background:#0a1730;color:#b9c4d2;padding:38px 0;font-size:13px}.footer-inner{line-height:1.9}
@media(max-width:1000px){nav{display:none}.header-inner{height:70px}.logo{width:190px}.header-cta{padding:12px 17px;font-size:14px}.portfolio-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:66px 0 42px}}
@media(max-width:700px){.container{width:calc(100% - 28px)}.portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.portfolio-photo{height:130px}.portfolio-body{padding:12px}.portfolio-body strong{font-size:14px}.portfolio-body p{font-size:12px}.hero h1{font-size:38px}.hero p{font-size:16px}}
.photo-trigger{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in;text-align:left;color:inherit}.photo-trigger:focus-visible{outline:3px solid #1b5798;outline-offset:3px}.photo-trigger .portfolio-photo{overflow:hidden}.photo-trigger .portfolio-photo img{transition:transform .25s ease}.photo-trigger:hover .portfolio-photo img{transform:scale(1.035)}.photo-count{position:absolute;right:9px;bottom:9px;background:#0b1730cc;color:white;border-radius:20px;padding:4px 8px;font-size:11px}.portfolio-photo{position:relative}.photo-modal{position:fixed;inset:0;z-index:9999;background:rgba(3,10,22,.88);display:none;align-items:center;justify-content:center;padding:24px}.photo-modal.open{display:flex}.photo-modal-dialog{width:min(1000px,100%);max-height:92vh;position:relative;display:flex;flex-direction:column;align-items:center}.photo-modal-image{display:block;max-width:100%;max-height:76vh;object-fit:contain;border-radius:8px}.photo-modal-caption{color:white;text-align:center;margin-top:12px;line-height:1.6}.photo-thumbnails{display:flex;gap:8px;justify-content:center;max-width:100%;overflow-x:auto;padding:12px 4px 4px}.photo-thumb{width:68px;height:54px;flex:0 0 auto;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#222;opacity:.72;cursor:pointer}.photo-thumb.active{border-color:#fff;opacity:1}.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}.photo-modal-close,.photo-modal-nav{position:absolute;border:0;background:#ffffff22;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center}.photo-modal-close{top:-14px;right:0;transform:translateY(-100%);width:42px;height:42px;border-radius:50%;font-size:28px}.photo-modal-nav{top:42%;width:44px;height:54px;border-radius:8px;font-size:28px}.photo-modal-prev{left:0}.photo-modal-next{right:0}.photo-modal-counter{color:#e5e7eb;font-size:13px;margin-top:8px}@media(max-width:600px){.photo-modal{padding:12px}.photo-modal-image{max-height:70vh}.photo-modal-nav{width:36px;height:46px}.photo-modal-close{right:4px}}</style>
</head>
<body>
<header><div class="container header-inner">

<nav><a href="index.html#products">PRODUCTS</a><a href="index.html#solution">SOLUTION</a><a href="portfolio.html">PORTFOLIO</a><a href="index.html#about">ABOUT</a><a href="index.html#contact">CONTACT</a></nav>

<section class="hero"><div class="container"><div class="eyebrow">PORTFOLIO</div><h1>현장에서 확인하는<br>DM SOLUTION의 기술력</h1><p>프로젝트와 설치 사례를 소개합니다.</p></div></section>
<main><div class="container"><div class="portfolio-grid" id="portfolio-grid"><div class="empty">포트폴리오를 불러오는 중입니다.</div></div></div></main>
<div class="photo-modal" id="photo-modal" role="dialog" aria-modal="true" aria-label="포트폴리오 사진 확대" onclick="if(event.target===this)closePhotoModal()"><div class="photo-modal-dialog"><button class="photo-modal-close" type="button" aria-label="닫기" onclick="closePhotoModal()">×</button><button class="photo-modal-nav photo-modal-prev" type="button" aria-label="이전 사진" onclick="changePhoto(-1)">‹</button><img class="photo-modal-image" id="photo-modal-image" src="" alt=""><button class="photo-modal-nav photo-modal-next" type="button" aria-label="다음 사진" onclick="changePhoto(1)">›</button><div class="photo-modal-caption" id="photo-modal-caption"></div><div class="photo-thumbnails" id="photo-thumbnails" aria-label="사진 미리보기"></div><div class="photo-modal-counter" id="photo-modal-counter"></div></div></div><footer><div class="container footer-inner">사업자등록번호 561-13-02556 | 대표전화 070-8866-8936 | FAX. 032-232-8955 | 이메일 <a href="mailto:dmsa0113@daum.net">dmsa0113@daum.net</a><br>주소 | (10008) 경기도 김포시 하성면 하성로570번길 231<br>© 디엠솔루션<br><a href="admin.html" style="display:inline-block;margin-top:8px;color:inherit;opacity:.75;text-decoration:none;font-size:12px">관리자</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let activePhotoSet=0,activePhotoIndex=0;
function openPhotoModal(setIndex,imageIndex){activePhotoSet=setIndex;activePhotoIndex=imageIndex;document.getElementById('photo-modal').classList.add('open');document.body.style.overflow='hidden';renderModalPhoto();}
function selectPhoto(index){activePhotoIndex=index;renderModalPhoto();}
function closePhotoModal(){document.getElementById('photo-modal').classList.remove('open');document.body.style.overflow='';}
function changePhoto(delta){const set=window.portfolioPhotoSets&&window.portfolioPhotoSets[activePhotoSet];if(!set||!set.images.length)return;activePhotoIndex=(activePhotoIndex+delta+set.images.length)%set.images.length;renderModalPhoto();}
function renderModalPhoto(){const set=window.portfolioPhotoSets&&window.portfolioPhotoSets[activePhotoSet];if(!set||!set.images.length)return;const image=document.getElementById('photo-modal-image');image.src=set.images[activePhotoIndex];image.alt=set.title;document.getElementById('photo-modal-caption').textContent=set.title+(set.description?' — '+set.description:'');document.getElementById('photo-modal-counter').textContent=(activePhotoIndex+1)+' / '+set.images.length+'장';
 const thumbs=document.getElementById('photo-thumbnails');
 thumbs.innerHTML=set.images.map((src,i)=>'<button type="button" class="photo-thumb '+(i===activePhotoIndex?'active':'')+'" aria-label="'+(i+1)+'번째 사진 보기" onclick="selectPhoto('+i+')"><img src="'+src+'" alt=""></button>').join('');document.querySelector('.photo-modal-prev').style.display=set.images.length>1?'flex':'none';document.querySelector('.photo-modal-next').style.display=set.images.length>1?'flex':'none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhotoModal();if(e.key==='ArrowLeft'&&document.getElementById('photo-modal').classList.contains('open'))changePhoto(-1);if(e.key==='ArrowRight'&&document.getElementById('photo-modal').classList.contains('open'))changePhoto(1);});
(async function(){
 const client=window.supabase.createClient("https://cbsayrtkctaotffuhwmk.supabase.co","sb_publishable_ccT_lYo9FTCeoxalnTS4og_ebYjDMZr");
 const grid=document.getElementById('portfolio-grid');
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 try{
  const {data,error}=await client.from('portfolio').select('id,title,description,image_urls,project_date').eq('is_published',true).order('sort_order',{ascending:true}).order('created_at',{ascending:false});
  if(error)throw error;
  if(!data||!data.length){grid.innerHTML='<div class="empty">아직 공개된 포트폴리오가 없습니다.<br>새 프로젝트가 등록되면 이곳에 소개됩니다.</div>';return;}
  window.portfolioPhotoSets=data.map(p=>({title:p.title,description:p.description||'',images:Array.isArray(p.image_urls)?p.image_urls:[]}));
  grid.innerHTML=data.map((p,i)=>{
   const imgs=Array.isArray(p.image_urls)?p.image_urls:[];
   const photo=imgs.length?'<button class="photo-trigger" type="button" aria-label="'+esc(p.title)+' 사진 크게 보기" onclick="openPhotoModal('+i+',0)"><div class="portfolio-photo"><img src="'+esc(imgs[0])+'" alt="'+esc(p.title)+'" loading="lazy">'+(imgs.length>1?'<span class="photo-count">+'+(imgs.length-1)+'장</span>':'')+'</div></button>':'<div class="portfolio-photo">현장 사진</div>';
   return '<article class="portfolio-card">'+photo+'<div class="portfolio-body"><strong>'+esc(p.title)+'</strong><p>'+esc(p.description||'')+'</p>'+(p.project_date?'<span class="portfolio-date">'+esc(p.project_date)+'</span>':'')+'</div></article>';
  }).join('');
 }catch(e){grid.innerHTML='<div class="empty">포트폴리오를 불러오지 못했습니다.<br>잠시 후 다시 확인해 주세요.</div>';console.error(e);}
})();
</script>
