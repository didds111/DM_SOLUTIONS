 const $=id=>document.getElementById(id);
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const categoryNames={panel:'판넬쿨러',liquid:'액체냉각패키지',oil:'오일쿨러',water:'워터칠러',fan:'팬쿨러',filter:'팬&필터'};
 window.closeDetail=function(){const modal=$('modalBackdrop');if(modal)modal.classList.remove('open');};
 document.addEventListener('keydown',event=>{if(event.key==='Escape')window.closeDetail();});
 const categoryOrder=['all','panel','liquid','oil','water','fan','filter'];
 const subOptions={

  filter:[['side','측면형'],['ceiling','천장형']]
 };
 let allProducts=[],activeCategory='all',activeSubcategory='all',searchTerm='';
 function normalize(value){return String(value||'').trim().toLowerCase();}
 function categoryFor(p){
  const raw=normalize(p.category),sub=normalize(p.subcategory),text=raw+' '+sub;
  if(raw==='filter'||text.includes('팬&필터')||text.includes('팬앤필터')||text.includes('fan & filter')||text.includes('fan filter')||text.includes('filter'))return 'filter';
  if(raw==='panel'||text.includes('판넬쿨러')||text.includes('판넬 쿨러')||text.includes('panel cooler'))return 'panel';
  if(raw==='liquid'||text.includes('액체냉각')||text.includes('액체 냉각')||text.includes('lcp'))return 'liquid';
  if(raw==='oil'||text.includes('오일쿨러')||text.includes('오일 쿨러')||text.includes('oil cooler'))return 'oil';
  if(raw==='water'||text.includes('워터칠러')||text.includes('워터 칠러')||text.includes('water chiller'))return 'water';
  if(raw==='fan'||text.includes('팬쿨러')||text.includes('팬 쿨러')||text.includes('fan cooler'))return 'fan';
  return 'other';
 }
 function subcategoryFor(p){
  const s=normalize(p.subcategory);
  if(categoryFor(p)==='panel'){
   if(/^ess(?:\b|\s|\()/i.test(s)||s.includes('옥외'))return 'ess';
   if(/^es(?:\b|\s|\()/i.test(s)||s.includes('에너지 절감'))return 'es';
   if(/^s(?:\b|\s|\()/i.test(s)||s.includes('측면')||s.includes('정면'))return 's';

   if(/^r(?:\b|\s|\()/i.test(s)||s.includes('천장')||s.includes('천정'))return 'r';
  }
  if(categoryFor(p)==='filter'){
   if(s.includes('천장')||s.includes('천정')||s==='ceiling')return 'ceiling';
   return 'side';
  }
  return 'all';
 }
 function renderSubcategories(){
  const box=$('catalogSubcategories');
  const opts=subOptions[activeCategory];
  if(!opts){box.innerHTML='';activeSubcategory='all';return;}
  if(!opts.some(([key])=>key===activeSubcategory))activeSubcategory='all';
  box.innerHTML='<button type="button" class="catalog-chip '+(activeSubcategory==='all'?'active':'')+'" data-catalog-sub="all">전체 세부 분류</button>'+opts.map(([key,label])=>'<button type="button" class="catalog-chip '+(activeSubcategory===key?'active':'')+'" data-catalog-sub="'+key+'">'+label+'</button>').join('');

 }
 function filteredProducts(){

   const cat=categoryFor(p);

   if(searchTerm){
    const hay=[p.name,p.model,p.category,p.subcategory,p.description,...Object.entries(p.specifications||{}).flat()].join(' ').toLowerCase();
    if(!hay.includes(searchTerm))return false;
   }
   return true;
  });
  const sort=$('productSort').value;
  if(sort==='name')list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
  else if(sort==='model')list.sort((a,b)=>String(a.model||'').localeCompare(String(b.model||''),'ko'));

   const specHtml=specs.map(([k,v])=>'<div class="spec-row"><span>'+esc(k)+'</span><b>'+esc(typeof v==='object'&&v!==null?JSON.stringify(v):v)+'</b></div>').join('');
   const detail='<div class="spec-row"><span>제품명</span><b>'+esc(p.name)+'</b></div>'+(p.model?'<div class="spec-row"><span>모델명</span><b>'+esc(p.model)+'</b></div>':'')+'<div class="spec-row"><span>분류</span><b>'+esc(categoryNames[cat]||p.category||'기타')+'</b></div>'+(p.subcategory?'<div class="spec-row"><span>세부 분류</span><b>'+esc(p.subcategory)+'</b></div>':'')+(p.description?'<div class="spec-row"><span>설명</span><b>'+esc(p.description)+'</b></div>':'')+specHtml;
   return '<article class="catalog-card"><div class="catalog-photo">'+(imgs[0]?'<img src="'+esc(imgs[0])+'" alt="'+esc(p.name)+'" loading="lazy">':'<span class="catalog-photo-placeholder">DM SOLUTION</span>')+'</div><div class="catalog-card-body"><span class="catalog-card-category">'+esc(categoryNames[cat]||p.category||'기타')+'</span><h3>'+esc(p.name||'제품명 미등록')+'</h3>'+(p.model?'<div class="catalog-model">모델명 · '+esc(p.model)+'</div>':'')+(p.description?'<p class="catalog-description">'+esc(p.description)+'</p>':'')+'<div class="catalog-detail"><button type="button" data-product-detail="'+p.id+'">상세 사양 보기</button></div></div><template id="product-detail-'+p.id+'">'+detail+'</template></article>';
  }).join('');
  grid.querySelectorAll('[data-product-detail]').forEach(b=>b.addEventListener('click',()=>{
   const template=$('product-detail-'+b.dataset.productDetail);
   if(!template)return;
   $('modalTitle').textContent=(list.find(p=>String(p.id)===b.dataset.productDetail)?.name||'제품')+' 상세 사양';
   $('modalSpecs').innerHTML=template.innerHTML;
   $('modalBackdrop').classList.add('open');
  }));
 }
 document.querySelectorAll('[data-catalog-cat]').forEach(b=>b.addEventListener('click',()=>{
  activeCategory=b.dataset.catalogCat;activeSubcategory='all';
  document.querySelectorAll('[data-catalog-cat]').forEach(x=>x.classList.toggle('active',x===b));
  renderSubcategories();renderProducts();
 }));
 $('productSearch').addEventListener('input',()=>{searchTerm=normalize($('productSearch').value);renderProducts();});
 $('productSort').addEventListener('change',renderProducts);
 $('heroTitle').textContent='제품소개';
 const hash=location.hash.replace('#','');
 const hashMap={'panel':'panel','liquid':'liquid','oil':'oil','water':'water','fan':'fan','filter':'filter','filter-side':'filter','filter-ceiling':'filter'};
 if(hashMap[hash]){activeCategory=hashMap[hash];document.querySelectorAll('[data-catalog-cat]').forEach(b=>b.classList.toggle('active',b.dataset.catalogCat===activeCategory));}
 renderSubcategories();
 try{
  const {data,error}=await client.from('products').select('id,name,model,category,subcategory,description,specifications,image_urls,created_at').eq('is_published',true).order('created_at',{ascending:false});
  if(error)throw error;
  allProducts=data||[];
  renderProducts();
 }catch(error){
  $('catalogGrid').innerHTML='';
  $('catalogError').classList.remove('hidden');
  console.error('CMS products load failed:',error);
 }
})();
</script>
